<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Catrachos de Corazon - Futurist Player</title>
    <style>
        body {
            margin: 0;
            background-color: #050508;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .player-card {
            width: 350px;
            background: linear-gradient(145deg, #12121a, #09090e);
            border: 2px solid #00ffcc;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
        }
        /* Pantalla visual estilo futurista con ondas simuladas */
        .visualizer {
            width: 100%;
            height: 110px;
            background: #000;
            border-radius: 8px;
            border: 1px solid #00ffcc55;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }
        .wave-bars {
            display: flex;
            gap: 4px;
            align-items: flex-end;
            height: 50px;
        }
        .bar {
            width: 6px;
            background: #00ffcc;
            height: 10px;
            border-radius: 3px;
            transition: height 0.2s ease;
        }
        /* Animación cuando está sonando */
        .playing .bar {
            animation: bounce 0.8s infinite alternate ease-in-out;
        }
        .playing .bar:nth-child(2) { animation-delay: 0.2s; }
        .playing .bar:nth-child(3) { animation-delay: 0.4s; }
        .playing .bar:nth-child(4) { animation-delay: 0.1s; }
        .playing .bar:nth-child(5) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { height: 10px; }
            100% { height: 45px; }
        }

        .station-title {
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .now-playing {
            font-size: 13px;
            color: #bbb;
            background: rgba(255, 255, 255, 0.05);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 15px;
            min-height: 20px;
            word-break: break-all;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        button {
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }
        button:hover {
            background: #00b38f;
            box-shadow: 0 0 10px #00ffcc;
        }
    </style>
</head>
<body>

    <div class="player-card" id="playerCard">
        <div class="station-title">Radio Catrachos de Corazon</div>
        
        <!-- Pantalla con ondas de movimiento -->
        <div class="visualizer" id="visualizerBox">
            <div class="wave-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
        </div>

        <div class="now-playing" id="songInfo">Conectando a la señal...</div>

        <div class="controls">
            <button onclick="playRadio()">▶ Play</button>
            <button onclick="stopRadio()">⏹ Stop</button>
        </div>
    </div>

    <!-- Enlace directo a tu servidor de audio -->
    <audio id="radioStream" src="https://radio.technoplayerserver.com/8010/stream"></audio>

    <script>
        const audio = document.getElementById('radioStream');
        const songInfo = document.getElementById('songInfo');
        const playerCard = document.getElementById('playerCard');

        function playRadio() {
            audio.play().catch(e => console.log("Error:", e));
            songInfo.innerText = "Transmisión en vivo...";
            playerCard.classList.add('playing');
        }

        function stopRadio() {
            audio.pause();
            audio.currentTime = 0;
            songInfo.innerText = "Transmisión detenida";
            playerCard.classList.remove('playing');
        }
    </script>
</body>
</html>
