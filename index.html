<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Catrachos de Corazon - Cyber Player</title>
    <style>
        body {
            margin: 0;
            background-color: #030305;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cyber-card {
            width: 380px;
            background: linear-gradient(135deg, #0d1117, #05070b);
            border: 2px solid #00ffcc;
            border-radius: 18px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.3), inset 0 0 15px rgba(0, 255, 204, 0.1);
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
        }
        .station-header {
            font-size: 14px;
            color: #00ffcc;
            font-weight: bold;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.5);
        }
        .screen-container {
            width: 100%;
            height: 130px;
            background: #000;
            border-radius: 12px;
            border: 1px solid #00ffcc55;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .wave-bars {
            display: flex;
            gap: 6px;
            align-items: flex-end;
            height: 50px;
            margin-bottom: 10px;
        }
        .bar {
            width: 6px;
            background: #00ffcc;
            height: 10px;
            border-radius: 3px;
            box-shadow: 0 0 8px #00ffcc;
            transition: height 0.2s ease;
        }
        .playing .bar {
            animation: pulseWave 0.8s infinite alternate ease-in-out;
        }
        .playing .bar:nth-child(1) { animation-delay: 0.1s; }
        .playing .bar:nth-child(2) { animation-delay: 0.3s; }
        .playing .bar:nth-child(3) { animation-delay: 0.5s; }
        .playing .bar:nth-child(4) { animation-delay: 0.2s; }
        .playing .bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes pulseWave {
            0% { height: 10px; }
            100% { height: 50px; }
        }

        .status-text {
            font-size: 12px;
            color: #00ffcc;
            letter-spacing: 1px;
        }

        .info-box {
            font-size: 13px;
            color: #bbb;
            background: rgba(0, 255, 204, 0.05);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 18px;
            border: 1px solid rgba(0, 255, 204, 0.1);
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 14px;
        }
        button {
            background: #00ffcc;
            color: #030305;
            border: none;
            padding: 11px 26px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
        }
        button:hover {
            background: #00b38f;
            box-shadow: 0 0 15px #00ffcc;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="cyber-card" id="playerCard">
        <div class="station-header">Radio Catrachos de Corazon</div>
        
        <div class="screen-container">
            <div class="wave-bars">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <div class="status-text" id="statusLabel">SISTEMA EN ESPERA</div>
        </div>

        <div class="info-box" id="songInfo">Conectado a servidor seguro</div>

        <div class="controls">
            <button onclick="playRadio()">▶ PLAY</button>
            <button onclick="stopRadio()">⏹ STOP</button>
        </div>
    </div>

    <audio id="radioStream" src="https://radio.technoplayerserver.com/8010/stream"></audio>

    <script>
        const audio = document.getElementById('radioStream');
        const songInfo = document.getElementById('songInfo');
        const statusLabel = document.getElementById('statusLabel');
        const playerCard = document.getElementById('playerCard');

        function playRadio() {
            audio.play().catch(e => console.log("Error:", e));
            songInfo.innerText = "Transmisión en vivo activada";
            statusLabel.innerText = "EN DIRECTO";
            playerCard.classList.add('playing');
        }

        function stopRadio() {
            audio.pause();
            audio.currentTime = 0;
            songInfo.innerText = "Transmisión detenida";
            statusLabel.innerText = "SISTEMA EN ESPERA";
            playerCard.classList.remove('playing');
        }
    </script>
</body>
</html>
