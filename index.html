<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Radio Catrachos de Corazon - Oficial</title>
    <style>
        body {
            margin: 0;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .cyber-card {
            width: 400px;
            background: linear-gradient(145deg, #110d08, #050302);
            border: 2px solid #00ffcc;
            border-radius: 18px;
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.4);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            color: #fff;
        }
        .station-header {
            font-size: 14px;
            color: #00ffcc;
            font-weight: 900;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6);
        }
        .player-frame-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            border-radius: 12px;
            border: 1px solid #00ffcc;
            overflow: hidden;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="cyber-card">
        <div class="station-header">Radio Catrachos de Corazon</div>
        
        <div class="player-frame-container">
            <!-- Reproductor oficial incrustado para mostrar título y DJ correctamente -->
            <iframe src="https://radio.technoplayerserver.com/public/radio_catrachos_de_corazon" width="100%" height="150px" frameborder="0" allowtransparency="true" scrolling="no"></iframe>
        </div>
    </div>

</body>
</html>
